# Scala CircleCI 2.1 configuration file
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/repo

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}
            - v2-dependencies-

      - run:
          name: Compile (2.13 and 3.3)
          command: sbt +Test/compile

      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}

      - run:
          name: Test (2.13 and 3.3)
          command: sbt +test

      # The Scala 3 modules are built with 3.3 (LTS) but should also work on the current LTS.
      # The spark module is Scala 2.13 only, so the modules are named explicitly.
      - run:
          name: Test (Scala 3.9)
          command: sbt "++3.9.0!" core/test cats/test parquet/test zio/test

      # Coverage on 2.13 (all modules), as the baseline for 2.0. It's reported, not enforced.
      # It starts with clean, because the earlier steps' classes aren't instrumented.
      - run:
          name: Coverage (2.13)
          command: sbt clean coverage test coverageAggregate

      - store_artifacts:
          path: target/scala-2.13/scoverage-report
          destination: coverage

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
